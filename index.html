<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Software Delivery Operating System - Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F2;
  --dot:#DEDEDA;
  --ink:#161616;
  --ink-soft:#4A4A48;
  --muted:#6E6E6A;
  --muted-2:#93938E;
  --paper:#FFFFFF;
  --line:#E2E2DE;

  --yellow:#FFE08A;
  --yellow-2:#FFD867;
  --purple:#DED3FA;
  --green:#BFEBCB;
  --blue:#CFE4FB;
  --gray:#E6E6E2;
  --dash:#B4B4AE;

  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --shadow:3px 3px 0 var(--ink);
  --shadow-lg:5px 5px 0 var(--ink);
  --shadow-sm:2px 2px 0 var(--ink);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:22px 22px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.18;letter-spacing:-.015em;}
p{margin:0;}
button{font-family:inherit;}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(244,244,242,.92);
  backdrop-filter:blur(8px);
  border-bottom:2px solid var(--ink);
}
.topbar-in{
  max-width:1120px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.02em;white-space:nowrap;}
.brand .chip{
  background:var(--yellow);border:2px solid var(--ink);border-radius:5px;
  box-shadow:var(--shadow-sm);padding:2px 7px;font-size:11.5px;font-weight:800;
}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;}
.tab{
  background:var(--paper);border:2px solid var(--ink);border-radius:5px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s,background .15s;
}
.tab:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.tab.active{background:var(--yellow);}

/* ============ LAYOUT ============ */
.wrap{max-width:1120px;margin:0 auto;padding:34px 20px 110px;}
.view{display:none;}
.view.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.page-head{max-width:660px;margin-bottom:30px;}
.kicker{
  display:inline-block;background:var(--ink);color:#fff;
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 9px;border-radius:4px;margin-bottom:14px;
}
.page-head h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:12px;}
.page-head p{color:var(--muted);font-size:15.5px;}

/* ============ LEGEND ============ */
.legend{
  display:flex;flex-wrap:wrap;gap:9px;margin-bottom:34px;
  padding:14px;background:var(--paper);
  border:2px solid var(--ink);border-radius:7px;box-shadow:var(--shadow);
}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
.swatch{width:15px;height:15px;border:2px solid var(--ink);border-radius:3px;flex:none;}

/* ============ TREE ============ */
.tree{position:relative;padding:6px 0;}
.tree::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;
  border-left:2px dashed var(--dash);transform:translateX(-1px);
}
.tree .node,
#view-roles .node{
  border:2px solid var(--ink);border-radius:6px;
  box-shadow:var(--shadow);
  padding:11px 16px;
  font-weight:600;font-size:14.5px;
  cursor:pointer;text-align:left;
  background:var(--paper);
  transition:transform .12s ease,box-shadow .12s ease;
  display:inline-flex;align-items:center;gap:9px;
  width:100%;
}
.tree .node:hover,
#view-roles .node:hover{transform:translate(-1.5px,-1.5px);box-shadow:var(--shadow-lg);}
.tree .node:active,
#view-roles .node:active{transform:translate(1.5px,1.5px);box-shadow:1px 1px 0 var(--ink);}
.tree .node:focus-visible,
#view-roles .node:focus-visible{outline:3px solid #2E6BE6;outline-offset:2px;}
.tree .node .num{
  flex:none;font-size:11.5px;font-weight:800;
  background:rgba(0,0,0,.14);border-radius:4px;padding:1px 6px;
}
.tree .node-stage,
#view-roles .node-stage{background:var(--yellow);font-size:15px;font-weight:700;}
.tree .node-sub{background:var(--purple);font-size:13px;padding:8px 13px;box-shadow:var(--shadow-sm);font-weight:600;}
.tree .node-sub:hover{box-shadow:var(--shadow);}
.tree .node-gate{background:var(--green);font-size:13px;font-weight:700;}
.tree .node-milestone{background:var(--blue);font-weight:700;}

.row{
  display:grid;grid-template-columns:1fr 300px 1fr;
  align-items:center;gap:0;
  position:relative;z-index:2;
  margin:0 0 10px;
}
.cell-spine{padding:0 4px;}
.cell-side{position:relative;padding:0 4px;}
.branch{
  position:relative;display:flex;flex-direction:column;gap:7px;
  align-items:stretch;
}
.branch::before{
  content:"";position:absolute;top:50%;width:30px;
  border-top:2px dashed var(--dash);
}
.cell-side.right .branch{padding-left:30px;}
.cell-side.right .branch::before{left:0;}
.cell-side.left .branch{padding-right:30px;}
.cell-side.left .branch::before{right:0;}
.tree .cell-side.left .node{text-align:right;}

.gate-row{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr 300px 1fr;
  margin:0 0 10px;
}
.gate-row .cell-spine{grid-column:2;}
.milestone-row{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr 300px 1fr;
  margin:0 0 14px;
}
.milestone-row .cell-spine{grid-column:2;}

@media (max-width:880px){
  .tree::before{left:17px;}
  .row,.gate-row,.milestone-row{grid-template-columns:1fr;}
  .cell-spine{padding-left:44px;margin-bottom:8px;}
  .cell-side{padding-left:44px;}
  .cell-side.left .branch{padding-right:0;padding-left:26px;}
  .cell-side.right .branch{padding-left:26px;}
  .cell-side.left .branch::before,.cell-side.right .branch::before{left:0;right:auto;width:26px;}
  .tree .cell-side.left .node{text-align:left;}
  .cell-side:empty{display:none;}
  .row{margin-bottom:16px;}
}

/* ============ DRAWER ============ */
.overlay{
  position:fixed;inset:0;background:rgba(22,22,22,.42);
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:90;
}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100%;
  width:min(560px,100%);
  background:var(--paper);
  border-left:2px solid var(--ink);
  transform:translateX(101%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:100;display:flex;flex-direction:column;
}
.drawer.show{transform:none;}
.drawer-head{
  padding:20px 24px 16px;border-bottom:2px solid var(--ink);
  display:flex;align-items:flex-start;gap:14px;flex:none;
}
.drawer-head .badge{
  font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border:2px solid var(--ink);border-radius:4px;padding:3px 8px;
  box-shadow:var(--shadow-sm);white-space:nowrap;
}
.drawer-head h3{font-size:20px;font-weight:800;margin-bottom:5px;}
.drawer-head .tag{font-size:13.5px;color:var(--muted);}
.close-btn{
  margin-left:auto;flex:none;
  width:32px;height:32px;border-radius:5px;
  border:2px solid var(--ink);background:var(--paper);
  box-shadow:var(--shadow-sm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  transition:transform .1s,box-shadow .1s;
}
.close-btn:hover{transform:translate(-1px,-1px);box-shadow:var(--shadow);}
.drawer-body{padding:22px 24px 60px;overflow-y:auto;flex:1;}

.blk{margin-bottom:22px;}
.blk-label{
  font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);margin-bottom:9px;
  display:flex;align-items:center;gap:7px;
}
.blk-label::before{content:"";width:12px;height:3px;background:var(--yellow-2);border:1px solid var(--ink);border-radius:2px;flex:none;}
.blk-label.p::before{background:var(--purple);}
.blk-label.g::before{background:var(--green);}
.blk-label.b::before{background:var(--blue);}
.blk p{font-size:14.2px;color:var(--ink-soft);}
ul.tick{margin:0;padding:0;list-style:none;}
ul.tick li{
  font-size:14px;color:var(--ink-soft);
  padding-left:19px;position:relative;margin-bottom:7px;
}
ul.tick li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--ink);border-radius:50%;}
ul.check li{padding-left:26px;}
ul.check li::before{
  content:"";position:absolute;left:0;top:2px;width:15px;height:15px;
  border:2px solid var(--ink);border-radius:3px;background:var(--paper);
}
.callout{
  background:#FBF7EA;border:2px solid var(--ink);border-radius:6px;
  padding:13px 15px;font-size:13.2px;color:var(--ink-soft);
  box-shadow:var(--shadow-sm);
}
.callout b{color:var(--ink);}
.meta-line{
  font-size:13.2px;color:var(--ink-soft);
  padding:11px 0 0;border-top:1px dashed var(--line);margin-top:4px;
}
.meta-line b{color:var(--ink);}

/* ============ GENERIC CARDS / TABLES ============ */
.card{
  background:var(--paper);border:2px solid var(--ink);border-radius:8px;
  box-shadow:var(--shadow);padding:22px;margin-bottom:20px;
}
.card h3{font-size:17.5px;font-weight:800;margin-bottom:6px;}
.card h4{font-size:14.5px;font-weight:700;margin:18px 0 8px;}
.card .sub{color:var(--muted);font-size:13.8px;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}

.tbl-wrap{overflow-x:auto;border:2px solid var(--ink);border-radius:8px;box-shadow:var(--shadow);background:var(--paper);margin-bottom:22px;}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:13px;}
th{
  background:var(--ink);color:#fff;text-align:left;
  padding:10px 12px;font-weight:700;font-size:11.5px;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink-soft);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even) td{background:#FAFAF8;}
td.c{text-align:center;font-weight:700;font-size:12px;color:var(--ink);}
.raci-A{background:var(--yellow)!important;}
.raci-R{background:var(--green)!important;}

.pill{
  display:inline-block;background:var(--paper);
  border:2px solid var(--ink);border-radius:999px;
  padding:4px 11px;font-size:12px;font-weight:600;
  box-shadow:var(--shadow-sm);margin:0 6px 6px 0;
}
.pill.y{background:var(--yellow);}
.pill.p{background:var(--purple);}
.pill.g{background:var(--green);}

/* ============ DIAGRAMS ============ */
.diagram-shell{margin:16px 0 4px;}
.diagram-toolbar{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  margin-bottom:8px;
}
.diagram-toolbar button,.diagram-toolbar output{
  min-width:36px;height:32px;border:2px solid var(--ink);border-radius:5px;
  background:var(--paper);color:var(--ink);font:700 12px var(--sans);
  display:inline-grid;place-items:center;padding:0 10px;
}
.diagram-toolbar output{min-width:58px;background:var(--bg);}
.diagram-toolbar button{cursor:pointer;}
.diagram-toolbar button:hover{background:var(--yellow);transform:none;box-shadow:none;}
.diagram-toolbar button:active{transform:none;box-shadow:none;}
.diagram-toolbar button:focus-visible,.mermaid-wrap:focus-visible{
  outline:3px solid #4C86C6;outline-offset:2px;
}
.mermaid-wrap{
  position:relative;width:100%;height:min(72vh,680px);min-height:360px;
  padding:0;overflow:scroll;overscroll-behavior:contain;cursor:grab;
  background:var(--paper);border:2px solid var(--ink);border-radius:7px;
  box-shadow:var(--shadow);touch-action:none;
  scrollbar-gutter:stable both-edges;
}
.mermaid-wrap.dragging{cursor:grabbing;user-select:none;}
.diagram-canvas{position:relative;min-width:100%;min-height:100%;}
.mermaid-wrap .mermaid{
  position:absolute;left:24px;top:24px;margin:0;padding:0;
  background:transparent;border:0;box-shadow:none;line-height:normal;
}
.mermaid-wrap svg{display:block;max-width:none!important;}
.mermaid-wrap *{transition:none!important;animation:none!important;}
.diagram-error{
  margin:24px;padding:14px;border:2px solid #A12B1F;border-radius:6px;
  background:#FBD3CC;color:#611B13;font-size:13px;font-weight:600;
}

.foot{
  margin-top:44px;padding-top:22px;border-top:2px dashed var(--dash);
  color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
@media(max-width:620px){
  .mermaid-wrap{height:62vh;min-height:320px;}
  .diagram-toolbar{justify-content:flex-start;overflow-x:auto;padding-bottom:2px;}
}
::selection{background:var(--yellow-2);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="chip">SDOS</span> Software Delivery Operating System</div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<div class="wrap">
  <div class="view active" id="view-roadmap"></div>
  <div class="view" id="view-methodology"></div>
  <div class="view" id="view-roles"></div>
  <div class="view" id="view-comms"></div>
  <div class="view" id="view-templates"></div>
  <div class="view" id="view-reference"></div>
  <div class="view" id="view-diagrams"></div>

  <div class="foot">
    <span>Standard Operating Procedure · v1.0 · Scrum-backbone hybrid (Scrum · XP · Kanban · Lean)</span>
    <span>Click any node to open its detail</span>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <span class="badge" id="drawer-badge">Stage</span>
    <div style="min-width:0">
      <h3 id="drawer-title">Title</h3>
      <div class="tag" id="drawer-tag"></div>
    </div>
    <button class="close-btn" id="close-btn" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
/* =====================================================================
   DATA - STAGES (with sub-nodes) AND GATES
   ===================================================================== */
const STAGES = [
{
  n:1,id:"conception",name:"Project Conception",
  tag:"Get everyone aligned on WHY before anyone writes a requirement.",
  objective:"Establish a single, shared mental model of why the project exists, what success looks like, and what is explicitly out of scope - before any requirement, design, or line of code is produced. Every downstream ambiguity traces back to a gap opened here.",
  entry:"A business need has been named by a stakeholder with authority to fund or prioritize it.",
  responsible:"PO/BA drafts the charter · PM/SM facilitates alignment · Tech Lead confirms high-level feasibility · Stakeholder(s) approve and sign off.",
  artifacts:["Project Vision &amp; Charter (problem, goals, success metrics)","Glossary of domain terms","Stakeholder map with decision authority","Assumptions log","Constraints log (budget, timeline, regulatory, technical)","Risk register (seeded)","Scope statement and explicit non-goals"],
  tools:["Notion / Confluence - living charter","Miro / Excalidraw - stakeholder &amp; context map","Risk register in the PM tool or a shared sheet"],
  deliverables:["A signed-off Project Charter every team member has read and can restate."],
  exit:["Vision statement signed by the accountable stakeholder(s)","Success metrics are numeric and measurable, not aspirational adjectives","Non-goals explicitly listed, not just implied by omission","Glossary covers every domain term appearing more than once","Top risks and assumptions logged with an owner each","Stakeholder map complete with each person's decision authority"],
  review:"Conception Alignment Workshop - a synchronous working session, not an email thread. The PO presents the draft; every role asks its standard questions; the stakeholder signs off in the room or within 48 hours.",
  validation:"<b>Same-Page Test:</b> the PM asks three team members, independently and without conferring, to restate the project's goal and one non-goal in a single sentence each. If the restatements meaningfully diverge, the gate fails and the charter is revised.",
  comms:["What problem are we actually solving, and for whom?","What does success look like, in numbers we can check later?","What are we explicitly NOT building in this phase?","What assumptions are we making that, if wrong, would change the plan?","Who has authority to change scope later, and where do we log that decision?"],
  fails:["Building the right solution to the wrong problem","Scope creep with no non-goals statement to point back to","Discovering late that two stakeholders never agreed on what success means"],
  grounding:"Grounded in the course's framing that software built without analysis, design, modeling, verification and validation risks missing user needs and being hard to maintain - and in the cahier des charges process (client commissions the need, then the document is refined jointly to clarify domain-specific detail). The Standish Group Chaos Report line quoted in the source material - smaller, more focused feature sets produce more value - is the explicit justification for the mandatory Non-Goals field.",
  subs:[
    {name:"Vision &amp; Charter",d:"The anchor document: problem statement, target users, 3–5 measurable goals, success metrics with a measurement method and deadline."},
    {name:"Glossary",d:"One sentence per domain term, no circular definitions, with an owner to ask when a definition needs to change. The cheapest ambiguity fix that exists."},
    {name:"Stakeholder Map",d:"Name, role, decision authority and engagement level for everyone who can influence or approve. Prevents 'who actually signs this off?' later."},
    {name:"Risks &amp; Assumptions",d:"Every assumption gets a confidence level and an owner; every risk gets likelihood, impact and an owner. Verbal risks don't count."},
    {name:"Scope &amp; Non-Goals",d:"What's in, and - critically - what is explicitly out. Non-goals are the only defence against scope creep that actually works."}
  ]
},
{
  n:2,id:"requirements",name:"Requirements Engineering",
  tag:"Turn the vision into requirements two people can't read two different ways.",
  objective:"Convert the shared vision into a complete, prioritized, testable set of functional and non-functional requirements, written so that a requirement and its test are two sides of the same sentence.",
  entry:"Stage 1 gate passed - signed Project Charter exists.",
  responsible:"PO/BA owns the BRD and Product Backlog · Tech Lead owns the SRS · UI/UX owns personas and journeys · QA reviews every story for ambiguity as it is written, not after.",
  artifacts:["Business Requirements Document (BRD) - the why/what in business language","Software Requirements Specification (SRS) - the technical how","Product Backlog of user stories (Name, ID, Role, Description, Type, State, Size, Priority)","Acceptance criteria per story (Given/When/Then)","Personas and use-case / user-journey diagrams","Non-functional requirements table structured by ISO/IEC 25010","Business rules register (separate from individual stories)","Edge-case log per story"],
  tools:["Jira or Linear - backlog with hierarchy and custom fields","Notion / Confluence - BRD and SRS as living documents","Miro / Figma - personas and journey maps","draw.io, Lucidchart or Mermaid - use-case and BPMN diagrams"],
  deliverables:["A prioritized, INVEST-quality backlog with acceptance criteria on every story planned for the next two sprints."],
  exit:["Every story follows \"As a [role], I want [goal], so that [reason]\" with ≥1 acceptance criterion","NFRs specified per ISO/IEC 25010 characteristic where relevant","Edge cases (invalid, empty, boundary, exceptional) enumerated per story","Business rules documented once, centrally, and referenced - never duplicated inline","BRD and SRS exist separately and do not contradict each other"],
  review:"Weekly Backlog Refinement, PO-led, whole team present. QA raises ambiguity flags live rather than after the meeting.",
  validation:"<b>Testability Check:</b> for every new or changed story, QA must be able to draft at least one test scenario directly from the acceptance criteria with zero clarifying questions. If QA can't, the story is not Ready and returns for rewriting.",
  comms:["Is this acceptance criterion something two different testers would test the same way?","What happens on invalid input, empty input, and the boundary value?","Which ISO 25010 quality attributes matter here, and what's the numeric target?","Does this contradict any existing requirement or business rule?","Who approved this requirement, and when?"],
  fails:["Stories that read as complete but are actually ambiguous","Missing edge cases surfacing for the first time in production","Non-functional requirements nobody designs or tests for because they were never explicit"],
  grounding:"Grounded in the BRD/SRS distinction and the PO / Business Analyst mandate from “Les rôles dans l'équipe de développement logiciel”, the Scrum User Story artifact and its eight fields, and the template “En tant que… je veux… afin de…” with the course's own training-session and train-ticket examples. The course names performance, usability, functionality, security and compatibility as example non-functional categories under ISO/IEC 25010; this framework extends that to the standard's full eight characteristics.",
  subs:[
    {name:"BRD - business language",d:"What the business needs and why, written so a non-technical stakeholder can approve it. Owned by the PO/BA."},
    {name:"SRS - technical spec",d:"How those needs will be built: data stores, platform choices, integration points. Owned by the Tech Lead."},
    {name:"User Stories",d:"As a [role], I want [goal], so that [reason]. Plus the eight Scrum story fields: Name, ID, Role, Description, Type, State, Size, Priority."},
    {name:"Acceptance Criteria",d:"Given/When/Then, and mandatory. This is the exact text QA turns into test scenarios - so the same sentence defines 'done' for the developer and 'pass' for the tester."},
    {name:"Non-Functional (ISO 25010)",d:"Functional suitability, performance efficiency, compatibility, usability, reliability, security, maintainability, portability - each with a numeric target and a way to measure it."},
    {name:"Edge Cases &amp; Business Rules",d:"Invalid input, empty input, boundary values, exceptional flows. Business rules live in one central register and get referenced, never copy-pasted into stories."}
  ]
},
{
  n:3,id:"validation",name:"Requirements Validation",
  tag:"Prove the requirements are unambiguous before anyone designs or codes.",
  objective:"Prove, before design or implementation begins, that the requirement set is complete, internally consistent, and unambiguous. This is the gate aimed most directly at the team's number-one failure: different people reading the same requirement differently.",
  entry:"Draft BRD, SRS and backlog exist for the scope being validated.",
  responsible:"QA leads the review · PO and Tech Lead co-review · the accountable Stakeholder approves anything that changed materially since Stage 1.",

const VIEWER_MIN_SCALE=.25;
const VIEWER_MAX_SCALE=3;
const VIEWER_FIT_MIN_SCALE=.08;
const VIEWER_SCALE_STEP=.15;
const VIEWER_PADDING=48;

function clampScale(value,min=VIEWER_MIN_SCALE){
  return Math.min(VIEWER_MAX_SCALE,Math.max(min,value));
}

function normalizeSvgViewBox(svg){
  const bounds=svg.getBBox();
  const padding=32;
  const x=bounds.x-padding;
  const y=bounds.y-padding;
  const width=bounds.width+padding*2;
  const height=bounds.height+padding*2;
  svg.setAttribute("viewBox",`${x} ${y} ${width} ${height}`);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  return {width,height};
}

function setDiagramScale(viewer,nextScale,anchor,allowFitScale=false){
  const {viewport,canvas,host,svg,zoomOutput,baseWidth,baseHeight}=viewer;
  const previous=viewer.scale;
  const minimum=allowFitScale ? VIEWER_FIT_MIN_SCALE : VIEWER_MIN_SCALE;
  const scale=clampScale(nextScale,minimum);
  const x=anchor?.x ?? viewport.clientWidth/2;
  const y=anchor?.y ?? viewport.clientHeight/2;
  const contentX=(viewport.scrollLeft+x)/previous;
  const contentY=(viewport.scrollTop+y)/previous;

  viewer.scale=scale;
  const scaledWidth=baseWidth*scale;
  const scaledHeight=baseHeight*scale;
  const canvasWidth=Math.max(viewport.clientWidth,scaledWidth+VIEWER_PADDING);
  const canvasHeight=Math.max(viewport.clientHeight,scaledHeight+VIEWER_PADDING);
  canvas.style.width=canvasWidth+"px";
  canvas.style.height=canvasHeight+"px";
  host.style.width=scaledWidth+"px";
  host.style.height=scaledHeight+"px";
  host.style.left=Math.max(24,(canvasWidth-scaledWidth)/2)+"px";
  host.style.top=Math.max(24,(canvasHeight-scaledHeight)/2)+"px";
  svg.style.width=scaledWidth+"px";
  svg.style.height=scaledHeight+"px";
  viewport.scrollLeft=Math.max(0,contentX*scale-x);
  viewport.scrollTop=Math.max(0,contentY*scale-y);
  const label=Math.round(scale*100)+"%";
  zoomOutput.value=label;
  zoomOutput.textContent=label;
}

function centerDiagram(viewer){
  viewer.viewport.scrollLeft=Math.max(
    0,
    (viewer.canvas.scrollWidth-viewer.viewport.clientWidth)/2
  );
  viewer.viewport.scrollTop=Math.max(
    0,
    (viewer.canvas.scrollHeight-viewer.viewport.clientHeight)/2
  );
}

function fitDiagram(viewer){
  const availableWidth=Math.max(1,viewer.viewport.clientWidth-VIEWER_PADDING);
  const availableHeight=Math.max(1,viewer.viewport.clientHeight-VIEWER_PADDING);
  const fitScale=Math.min(
    availableWidth/viewer.baseWidth,
    availableHeight/viewer.baseHeight,
    1
  );
  setDiagramScale(viewer,fitScale,undefined,true);
  centerDiagram(viewer);
}

function initializeDiagramViewer(shell,svg){
  const viewport=shell.querySelector(".mermaid-wrap");
  const canvas=shell.querySelector(".diagram-canvas");
  const host=shell.querySelector("[id^='mmd-']");
  const zoomOutput=shell.querySelector("[data-role='zoom']");
  const normalizedBounds=normalizeSvgViewBox(svg);
  const viewer={
    shell,viewport,canvas,host,svg,zoomOutput,
    baseWidth:normalizedBounds.width,
    baseHeight:normalizedBounds.height,
    scale:1
  };
  let drag=null;

  svg.setAttribute("width",String(viewer.baseWidth));
  svg.setAttribute("height",String(viewer.baseHeight));
  svg.style.width=viewer.baseWidth+"px";
  svg.style.height=viewer.baseHeight+"px";
  svg.style.maxWidth="none";

  shell.querySelector("[data-action='zoom-in']").addEventListener("click",()=>{
    setDiagramScale(viewer,viewer.scale+VIEWER_SCALE_STEP);
  });
  shell.querySelector("[data-action='zoom-out']").addEventListener("click",()=>{
    setDiagramScale(viewer,viewer.scale-VIEWER_SCALE_STEP);
  });
  shell.querySelector("[data-action='actual']").addEventListener("click",()=>{
    setDiagramScale(viewer,1);
    centerDiagram(viewer);
  });
  shell.querySelector("[data-action='fit']").addEventListener("click",()=>{
    fitDiagram(viewer);
  });

  viewport.addEventListener("wheel",event=>{
    if(!event.ctrlKey) return;
    event.preventDefault();
    const rect=viewport.getBoundingClientRect();
    const pinchScale=Math.exp(-event.deltaY*.01);
    setDiagramScale(viewer,viewer.scale*pinchScale,{
      x:event.clientX-rect.left,
      y:event.clientY-rect.top
    });
  },{passive:false});

  viewport.addEventListener("pointerdown",event=>{
    if(event.button!==0) return;
    drag={
      x:event.clientX,
      y:event.clientY,
      left:viewport.scrollLeft,
      top:viewport.scrollTop
    };
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add("dragging");
  });
  viewport.addEventListener("pointermove",event=>{
    if(!drag) return;
    viewport.scrollLeft=drag.left-(event.clientX-drag.x);
    viewport.scrollTop=drag.top-(event.clientY-drag.y);
  });
  const stopDrag=()=>{
    drag=null;
    viewport.classList.remove("dragging");
  };
  viewport.addEventListener("pointerup",stopDrag);
  viewport.addEventListener("pointercancel",stopDrag);
  viewport.addEventListener("lostpointercapture",stopDrag);

  setDiagramScale(viewer,1);
  requestAnimationFrame(()=>fitDiagram(viewer));
  return viewer;
}

async function paintMermaidDiagrams(){
  if(mermaidPainted || typeof mermaid==="undefined") return;
  if(!mermaidReady){
    mermaid.initialize({
      startOnLoad:false,
      theme:"base",
      securityLevel:"loose",
      flowchart:{curve:"basis",htmlLabels:true,useMaxWidth:false,nodeSpacing:40,rankSpacing:50},
      themeVariables:{
        fontFamily:"Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
        primaryColor:"#FFE08A",
        primaryTextColor:"#161616",
        primaryBorderColor:"#161616",
        lineColor:"#161616",
        secondaryColor:"#BFEBCB",
        tertiaryColor:"#CFE4FB",
        mainBkg:"#FFE08A",
        nodeBorder:"#161616",
        clusterBkg:"#FFFFFF",
        titleColor:"#161616",
        edgeLabelBackground:"#F4F4F2"
      }
    });
    mermaidReady=true;
  }
  if(document.fonts?.ready) await document.fonts.ready;
  for(const d of DIAGRAMS){
    const host=document.getElementById("mmd-"+d.id);
    if(!host) continue;
    try{
      const {svg}=await mermaid.render("svg-"+d.id+"-"+Date.now(), d.mermaid);
      host.innerHTML=svg;
      const el=host.querySelector("svg");
      if(el){
        await new Promise(resolve=>
          requestAnimationFrame(()=>requestAnimationFrame(resolve))
        );
        initializeDiagramViewer(host.closest(".diagram-shell"),el);
      }
    }catch(err){
      host.className="diagram-error";
      host.textContent="Could not render diagram: "+(err?.message||err);
    }
  }
  mermaidPainted=true;
}

/* ---------- table helper (cells may be strings or {v,cls}) ---------- */
function table(headers,rows){
  let h=`<div class="tbl-wrap"><table><thead><tr>`;
  h+=headers.map(x=>`<th>${x}</th>`).join("");
  h+=`</tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr>`+r.map(c=>{
      if(c && typeof c==="object") return `<td class="${c.cls}">${c.v}</td>`;
      return `<td>${c}</td>`;
    }).join("")+`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

/* =====================================================================
   DRAWER
   ===================================================================== */
const drawer=$("#drawer"),overlay=$("#overlay");
let lastFocus=null;

function openDrawer(badge,badgeBg,title,tag,bodyHtml){
  $("#drawer-badge").textContent=badge;
  $("#drawer-badge").style.background=badgeBg;
  $("#drawer-title").innerHTML=title;
  $("#drawer-tag").innerHTML=tag||"";
  $("#drawer-body").innerHTML=bodyHtml;
  $("#drawer-body").scrollTop=0;
  drawer.classList.add("show");overlay.classList.add("show");
  $("#close-btn").focus();
}
function closeDrawer(){
  drawer.classList.remove("show");overlay.classList.remove("show");
  if(lastFocus) lastFocus.focus();
}
overlay.addEventListener("click",closeDrawer);
$("#close-btn").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeDrawer();});

function blk(label,cls,inner){
  return `<div class="blk"><div class="blk-label ${cls||''}">${label}</div>${inner}</div>`;
}
function ul(items,cls){
  return `<ul class="tick ${cls||''}">${items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
}

function openStage(id){
  const s=STAGES.find(x=>x.id===id);if(!s)return;
  let b="";
  b+=blk("Objective","",`<p>${s.objective}</p>`);
  b+=blk("Entry criteria","b",`<p>${s.entry}</p>`);
  b+=blk("Required artifacts","p",ul(s.artifacts));
  b+=blk("Tools","p",ul(s.tools));
  b+=blk("Deliverables","",ul(s.deliverables));
  b+=blk("Exit criteria - validation gate","g",ul(s.exit,"check"));
  b+=blk("Review process","",`<p>${s.review}</p>`);
  b+=blk("Validation process","g",`<div class="callout">${s.validation}</div>`);
  b+=blk("Communication checkpoint questions","b",ul(s.comms));
  b+=blk("Failure modes this prevents","",ul(s.fails));
  b+=blk("Source grounding","",`<div class="callout" style="background:#F4F1FB">${s.grounding}</div>`);
  b+=`<div class="meta-line"><b>Responsible:</b> ${s.responsible}</div>`;
  openDrawer("Stage "+s.n,"var(--yellow)",s.name,s.tag,b);
}
function openSub(stageId,idx){
  const s=STAGES.find(x=>x.id===stageId);if(!s)return;
  const sub=s.subs[idx];if(!sub)return;
  let b=blk("What it is","p",`<p>${sub.d}</p>`);
  b+=`<div class="meta-line">Part of <b>Stage ${s.n} - ${s.name}</b>.</div>`;
  b+=`<div style="margin-top:16px"><button class="copy-btn" id="goto-stage">Open Stage ${s.n} in full →</button></div>`;
  openDrawer("Sub-topic","var(--purple)",sub.name,"Stage "+s.n+" · "+s.name,b);
  const g=document.getElementById("goto-stage");
  if(g) g.addEventListener("click",()=>openStage(stageId));
}
function openGate(n){
  const g=GATES.find(x=>x.n===Number(n));if(!g)return;
  const s=STAGES[Number(n)-1];
  let b=blk("Sits between","b",`<p>${g.between}</p>`);
  b+=blk("Passes when","g",`<div class="callout">${g.passes}</div>`);
  b+=blk("Approved by","",`<p>${g.approver}</p>`);
  if(s) b+=blk("Full exit checklist","g",ul(s.exit,"check"));
  b+=`<div class="meta-line">No one proceeds past a gate until it is passed. A gate that gets waived under time pressure is not a gate.</div>`;
  openDrawer("Gate G"+g.n,"var(--green)",g.name,g.between,b);
}
function openRole(id){
  const r=ROLES.find(x=>x.id===id);if(!r)return;
  let b=blk("Mandate","",`<p>${r.mandate}</p>`);
  b+=blk("Receives","b",ul(r.receives));
  b+=blk("Produces","p",ul(r.produces));
  b+=blk("Talks to","",`<p>${r.talks}</p>`);
  b+=blk("Source grounding","",`<div class="callout" style="background:#F4F1FB">${r.grounding}</div>`);
  openDrawer("Role","var(--yellow)",r.title,r.aka,b);
}
const INFO={
 start:{t:"Project kickoff",tag:"Entry point into the system",b:`<div class="blk"><p>The system starts when a business need is named by a stakeholder with the authority to fund or prioritize it - not when someone has an idea, and not when code starts.</p></div><div class="blk"><div class="blk-label b">Why this matters</div><p>An unnamed sponsor is the most common root cause of a project that cannot resolve its own scope disputes later. If nobody can approve, nobody can decide.</p></div>`},
 loop:{t:"The loop",tag:"Where the cycle restarts",b:`<div class="blk"><p>After Gate G10, the cycle returns to Stage 6 - Sprint Planning - for the next sprint. Stages 1 to 5 are re-entered only when new scope arrives, not every sprint.</p></div><div class="blk"><div class="blk-label g">The rule that keeps this honest</div><p>At least one retrospective action item must be scheduled into the very next sprint as real, estimated work. A retrospective that produces only discussion has not passed its gate.</p></div>`}
};
function openInfo(k){
  const i=INFO[k];if(!i)return;
  openDrawer("Milestone","var(--blue)",i.t,i.tag,i.b);
}

document.addEventListener("click",e=>{
  const n=e.target.closest("[data-kind]");
  if(!n)return;
  lastFocus=n;
  const k=n.dataset.kind;
  if(k==="stage") openStage(n.dataset.key);
  else if(k==="sub") openSub(n.dataset.stage,n.dataset.idx);
  else if(k==="gate") openGate(n.dataset.key);
  else if(k==="role") openRole(n.dataset.key);
  else if(k==="info") openInfo(n.dataset.key);
});

/* =====================================================================
   INIT
   ===================================================================== */
renderTabs();
renderRoadmap();
renderMethodology();
renderRoles();
renderComms();
renderTemplates();
renderReference();
renderDiagrams();
</script>
